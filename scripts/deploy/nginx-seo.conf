# #27: SEO sahifalari — /etc/nginx/sites-available/kitchens ga qo'shiladi (sudo).
# 1) Asosiy server blokida, "location / { try_files ... }" dan OLDIN:

    # Serverda tayyorlanadigan ochiq sahifalar (Laravel Blade)
    location ~ ^/(ru|sitemap\.xml)?$ {
        fastcgi_pass unix:/run/php/kitchens.sock;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/kitchens/backend/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/kitchens/backend/public;
    }
    location ^~ /r/ {
        fastcgi_pass unix:/run/php/kitchens.sock;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/kitchens/backend/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/kitchens/backend/public;
    }

# 2) server_name dan www.kitchens.uz ni olib tashlang va alohida 301 blok qo'shing:

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.kitchens.uz;
    ssl_certificate /etc/letsencrypt/live/kitchens.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kitchens.uz/privkey.pem;
    return 301 https://kitchens.uz$request_uri;
}

# Tekshirish: sudo nginx -t && sudo systemctl reload nginx
#   curl -sI https://kitchens.uz/ | grep -i content-type     → text/html (Laravel)
#   curl -sI https://www.kitchens.uz/menu | grep -i location → https://kitchens.uz/menu
